name: Build iOS IPA (unsigned)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install gems
        run: |
          gem install bundler -v '~> 2.5'
          bundle install

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build unsigned IPA via Fastlane gym
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bundle exec fastlane gym \
            --workspace "Brokenithm-iOS.xcworkspace" \
            --scheme "Brokenithm-iOS" \
            --configuration "Release" \
            --skip_codesigning true \
            --output_directory "artifacts" \
            --output_name "Brokenithm-unsigned"
          echo "IPA_PATH=$(pwd)/artifacts/Brokenithm-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-ipa-unsigned
          path: ${{ env.IPA_PATH }}