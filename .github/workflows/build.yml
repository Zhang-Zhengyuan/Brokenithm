name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]  # 当你推送代码到 main 分支时触发
  workflow_dispatch:      # 允许你在 GitHub 页面上手动点击运行

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # 根据你的 Gemfile 调整版本，通常 3.2 比较稳定
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          pod install

      - name: Build Project (Unsigned)
        run: |
          xcodebuild -workspace Brokenithm-iOS.xcworkspace \
                     -scheme Brokenithm-iOS \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          # 寻找生成的 .app 文件并移动到 Payload 文件夹
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          # 压缩为 ipa
          zip -r Brokenithm-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-Unsigned-IPA
          path: Brokenithm-iOS.ipa