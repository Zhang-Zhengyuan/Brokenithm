name: Build iOS IPA (unsigned)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install gems
        run: |
          gem install bundler -v '~> 2.5'
          bundle install

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build unsigned app with xcodebuild
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace "Brokenithm-iOS.xcworkspace" \
            -scheme "Brokenithm-iOS" \
            -configuration Release \
            -archivePath build/Brokenithm.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          cp -r build/Brokenithm.xcarchive/Products/Applications/*.app artifacts/Payload/
          cd artifacts
          zip -r Brokenithm-unsigned.ipa Payload
          rm -rf Payload
          echo "IPA_PATH=$(pwd)/Brokenithm-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-ipa-unsigned
          path: ${{ env.IPA_PATH }}