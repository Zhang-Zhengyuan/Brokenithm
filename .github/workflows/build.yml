name: Build iOS IPA (unsigned)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install gems
        run: bundle install --path vendor/bundle

      - name: Build unsigned IPA via Fastlane gym
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bundle exec fastlane gym \
            --workspace "Brokenithm-iOS.xcworkspace" \
            --scheme "Brokenithm-iOS" \
            --configuration "Release" \
            --skip_codesigning true \
            --output_directory "artifacts" \
            --output_name "Brokenithm-unsigned"
          echo "IPA_PATH=$(pwd)/artifacts/Brokenithm-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-ipa-unsigned
          path: ${{ env.IPA_PATH }}
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      # ===== 修改这里 =====
      # scheme 和 workspace 名必须与你项目一致
      - name: Build archive (no signing)
        run: |
          xcodebuild \
            -workspace Brokenithm-iOS.xcworkspace \
            -scheme Brokenithm-iOS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Brokenithm.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean archive

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Export IPA (unsigned)
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Brokenithm.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Brokenithm-IPA
          path: build/ipa/*.ipa
